name: Mobile Typecheck

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-typecheck.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install mobile dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Typecheck mobile
        run: npm run typecheck

      - name: Run E23/E24 Creator source parity
        run: bun test tests/creator-e23-e24-source-parity.test.ts

      - name: Run E25/E26 Community source parity
        run: bun test tests/community-e25-e26-source-parity.test.ts

      - name: Run E27/E28 Community and Arena source parity
        run: bun test tests/community-arena-e27-e28-source-parity.test.ts

      - name: Run E29/E30 Premium and integration source parity
        run: bun test tests/premium-integration-e29-e30-source-parity.test.ts

      - name: Run E31/E32 Billing and push source parity
        run: bun test tests/billing-push-e31-e32-source-parity.test.ts

      - name: Run E33/E34 Journey and Creator source parity
        run: bun test tests/journey-creator-e33-e34-source-parity.test.ts

      - name: Run E35/E36 Agent Core and workspace source parity
        run: bun test tests/agent-projects-tasks-e35-e36-source-parity.test.ts

      - name: Run E37/E38 Identity and Project Check-in source parity
        run: bun test tests/identity-checkins-e37-e38-source-parity.test.ts

      - name: Run E39/E40 Passport and Creator source parity
        run: bun test tests/passport-creator-e39-e40-source-parity.test.ts

      - name: Run Agent Premium authority source parity
        run: bun test tests/agent-premium-phase2-source-parity.test.ts

      - name: Run Creator YouTube diagnostics source parity
        run: bun test tests/creator-youtube-diagnostics-phase2.test.ts

      - name: Run Creator localization source parity
        run: bun test tests/creator-localization-phase2.test.ts

      - name: Run E41/E42 Documents and Finance source parity
        run: bun test tests/documents-finance-e41-e42-source-parity.test.ts

      - name: Run E43/E44 Studies and Journeys source parity
        run: bun test tests/studies-journeys-e43-e44-source-parity.test.ts

      - name: Run E45/E46 Notes and Notifications source parity
        run: bun test tests/notes-notifications-e45-e46-source-parity.test.ts

      - name: Run E47/E48 Files and Translations source parity
        run: bun test tests/files-translations-e47-e48-source-parity.test.ts

      - name: Run E49/E50 Assistant and API keys source parity
        run: bun test tests/assistant-apikeys-e49-e50-source-parity.test.ts

      - name: Run E51/E52 Activity and Journeys source parity
        run: bun test tests/activity-journeys-e51-e52-source-parity.test.ts

      - name: Run E53/E54 Studio and Passport source parity
        run: bun test tests/studio-passport-e53-e54-source-parity.test.ts

      - name: Run E55/E56 Creator and runtime source parity
        run: bun test tests/creator-runtime-e55-e56-source-parity.test.ts

      - name: Run E57/E58 final database source parity
        run: bun test tests/final-db-e57-e58-source-parity.test.ts

      - name: Run E59/E60 Google Workspace source parity
        run: bun test tests/google-workspace-e59-e60-source-parity.test.ts

      - name: Run E61/E62 approved Google action source parity
        run: bun test tests/approved-google-actions-e61-e62-source-parity.test.ts

      - name: Run E63/E64 YouTube OAuth source parity
        run: bun test tests/youtube-oauth-e63-e64-source-parity.test.ts

      - name: Run E65/E66 Creator transcript and candidates source parity
        run: bun test tests/creator-transcript-candidates-e65-e66-source-parity.test.ts

      - name: Run E67/E68 AI provider and Gemini base source parity
        run: bun test tests/ai-provider-gemini-e67-e68-source-parity.test.ts

      - name: Run E69/E70 Creator worker runtime source parity
        run: bun test tests/creator-worker-e69-e70-source-parity.test.ts

      - name: Run existing Creator engine and intelligence contracts
        run: bun test tests/creator-video-engine-revision-14.test.ts tests/creator-intelligence-revision-14.test.ts
