name: Creator Worker Quality

on:
  pull_request:
    paths:
      - "services/creator-worker/**"
      - ".github/workflows/creator-worker-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/creator-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install worker dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck worker
        run: bun run typecheck

      - name: Test worker
        run: bun test
