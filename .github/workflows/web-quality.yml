name: Web Quality

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/**"
      - ".env.example"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web and generate route types
        run: bun run build

      - name: Typecheck web
        run: bun run typecheck

      - name: Verify PWA/TWA static consistency
        run: bun run check:pwa

      - name: Run web contract tests
        run: bun run test:web
